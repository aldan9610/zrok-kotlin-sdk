name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El SDK de Android ya viene preinstalado en los runners de GitHub
      # (ANDROID_HOME=/usr/local/lib/android/sdk, licencias aceptadas);
      # android-actions/setup-android@v3 falla porque el paquete 'tools'
      # ya no existe en el repositorio del SDK.
      - name: Build y tests (JVM + Android)
        run: ./gradlew build :zrok-android:assembleRelease :sample-android:assembleDebug --stacktrace

      - name: Subir APK de ejemplo
        uses: actions/upload-artifact@v4
        with:
          name: sample-apk
          path: sample-android/build/outputs/apk/debug/*.apk
